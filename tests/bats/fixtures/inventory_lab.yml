# Fixture inventory used by tests/bats/test_inventory.bats.
# Keep stable — tests assert specific field values.
profile: lab
stack_version: "9.4.2"

hosts:
  - name: elk-test-a
    address: 10.99.0.10
    ssh_user: admin
    ssh_key: ~/.ssh/test
    roles:
      - es-master
      - es-data
      - logstash
      - kibana
  - name: elk-test-b
    address: 10.99.0.11
    ssh_user: ubuntu
    ssh_key: ~/.ssh/test
    roles:
      - logstash

kibana:
  public_fqdn: "kibana.test.example.com"
  letsencrypt_email: "admin@test.example.com"
  allowed_cidrs:
    - 10.99.0.0/16
    - 192.168.1.5/32

templates:
  - name: generic-syslog
    enabled: true
    udp_port: 5140
    tcp_port: 5140
  - name: barracuda-waf
    enabled: true
    udp_port: 5141
    tcp_port: 5141
  - name: not-enabled-vendor
    enabled: false
    udp_port: 5142
    tcp_port: 5142
