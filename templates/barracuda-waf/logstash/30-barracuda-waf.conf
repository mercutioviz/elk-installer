# Barracuda WAF pipeline — RFC3164 syslog with kv tail.
# Owned by template barracuda-waf. Frozen from a captured sample.
#
# Sample event:
#   <134>May 30 03:43:43 waf01 BARRACUDA WAF EVT=block SRC=1.2.3.4
#     DST=10.20.30.1 METHOD=GET URL=/login.php STATUS=403
#     ATTACK=sql-injection ACTION=block USER=anonymous SIZE=1245
#
# Tokens — see templates/generic-syslog/logstash/30-generic-syslog.conf.

input {
  tcp {
    port => __LS_INTERNAL_PORT__
    codec => line
    type => "__VENDOR__"
    tags => ["__VENDOR__"]
  }
}

filter {
  # 1) Parse the syslog envelope. SYSLOGLINE requires `:` after the tag; the
  #    Barracuda format omits it, so we use a hand-rolled grok with the
  #    tag-colon optional. overwrite=>message so [message] becomes the part
  #    after the syslog header (cleaner for kv).
  grok {
    match => {
      "message" => "<%{NONNEGINT:[log][syslog][priority]:int}>%{SYSLOGTIMESTAMP:[event][created_raw]} %{HOSTNAME:[host][name]} %{WORD:[process][name]}(?:\[%{POSINT:[process][pid]:int}\])?:? %{GREEDYDATA:message}"
    }
    overwrite => ["message"]
    tag_on_failure => ["_grokparsefailure", "_barracuda_envelope_fail"]
  }

  # 2) Map syslog priority to facility / severity.
  if [log][syslog][priority] {
    ruby {
      code => "
        p = event.get('[log][syslog][priority]').to_i
        event.set('[log][syslog][facility][code]', p / 8)
        event.set('[log][syslog][severity][code]', p % 8)
      "
    }
  }

  # 3) Extract the WAF key=value tail into structured fields.
  kv {
    source => "message"
    field_split_pattern => "[ \t]"
    value_split => "="
    include_keys => ["EVT","SRC","DST","METHOD","URL","STATUS","ATTACK","ACTION","USER","SIZE"]
    target => "[waf]"
  }

  # 4) Promote canonical ECS-ish fields.
  mutate {
    rename => {
      "[waf][SRC]"    => "[source][ip]"
      "[waf][DST]"    => "[destination][ip]"
      "[waf][METHOD]" => "[http][request][method]"
      "[waf][URL]"    => "[url][path]"
      "[waf][USER]"   => "[user][name]"
    }
    convert => {
      "[waf][STATUS]" => "integer"
      "[waf][SIZE]"   => "integer"
    }
  }
  if [waf][STATUS] {
    mutate { rename => { "[waf][STATUS]" => "[http][response][status_code]" } }
  }
  if [waf][SIZE] {
    mutate { rename => { "[waf][SIZE]" => "[http][response][body][bytes]" } }
  }
  if [waf][EVT]    { mutate { rename => { "[waf][EVT]"    => "[event][outcome]" } } }
  if [waf][ATTACK] { mutate { rename => { "[waf][ATTACK]" => "[rule][category]" } } }
  if [waf][ACTION] { mutate { rename => { "[waf][ACTION]" => "[event][action]" } } }

  # 5) Date — syslog timestamp lacks a year. Logstash @timestamp falls back
  #    to ingest time; explicit date filter for the parsed field.
  date {
    match => [ "[event][created_raw]", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss" ]
    target => "@timestamp"
    remove_field => ["[event][created_raw]"]
  }
}

output {
  elasticsearch {
    hosts => ["https://127.0.0.1:9200"]
    user  => "__LS_ES_USER__"
    password => "${LS_ES_PASSWORD}"
    ssl_certificate_authorities => ["__LS_ES_CA_PATH__"]
    data_stream => "true"
    data_stream_type      => "logs"
    data_stream_dataset   => "__VENDOR_DATASET__"
    data_stream_namespace => "default"
  }
}
