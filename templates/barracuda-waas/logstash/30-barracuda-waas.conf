# Barracuda WAF-as-a-Service (WaaS) pipeline — v0.1.5
# Tokens: __LS_INTERNAL_PORT__ __LS_ES_USER__ __LS_ES_CA_PATH__ __ES_HOST__ __VENDOR__ __PATTERNS_DIR__
#
# v0.1.5: Use dissect for log_type/timestamp, Ruby filter for full field extraction.
# Ruby's regex is more predictable than Logstash grok for complex formats.
#
# WaaS format strings configured in each app:
#   TR: %t %un %lt %ai %ap %ci %cp %id %cu %m %p "%h" %v %s %bs %br %ch %tt %si %sp %st %sid %rtf %pmf %pf %wmf "%u" "%q" "%r" "%c" "%ua" %px %pp %au %cs1 %cs2 %cs3 %cc %uid
#   WF: %t %un %lt %sl %ad %ci %cp %ai %ap %ri %rt %at %fa %m "%u" "%q" %p %sid "%ua" %px %pp %au "%r" %cc %uid %adl

input {
  tcp {
    port  => __LS_INTERNAL_PORT__
    codec => line
    type  => "__VENDOR__"
    tags  => ["barracuda-waas"]
  }
}

filter {
  # Step 1: dissect — extract log_type + timestamp from fixed positions
  dissect {
    mapping => {
      "message" => "%{?rsl_ts} %{?rsl_host} %{t_date} %{t_time} %{t_tz} %{[waas][unit_name]} %{[waas][log_type]} %{+?rest_skip}"
    }
    tag_on_failure => ["_waas_type_extract_fail"]
  }

  # Step 2a: TR — Ruby regex parser
  if [waas][log_type] == "TR" {
    ruby {
      tag_on_exception => "_waas_tr_ruby_fail"
      code => '
        msg = event.get("message").to_s

        # Skip rsyslog header — find the WaaS body starting with YYYY-MM-DD<space><digit>
        # (rsyslog ISO8601 uses T-separator; WaaS date uses space-separator)
        m = msg.match(/\d{4}-\d{2}-\d{2} \d.*/)
        next unless m
        body = m[0]

        # TR format (after header): DATE TIME TZ UNIT TR DST_IP DST_PORT SRC_IP SRC_PORT
        #   ID CU METHOD PROTO "HOST" VER STATUS BS BR CH TT SERVER_IP SP ST SID
        #   RTF PMF PF WMF "URL" "QUERY" "REFERER" "COOKIE" "UA" PX_IP PX_PORT
        #   AU CS1 CS2 CS3 CC UID
        #
        # Quoted-field pattern: either "-" (null) or "real value possibly with spaces"
        # Unquoted-null pattern: "-" (exactly 3 chars)
        #
        # We build one regex that matches the whole WaaS body.
        QF  = /"-"|"([^"]*)"/    # quoted field: captures inner value or nil for null
        UNQ = /\S+/              # unquoted token (could be "-" for null)
        SP  = /\s+/

        tr_re = /
          \S+\s+\S+\s+\S+\s+   # date time tz
          \S+\s+                 # unit
          TR\s+                  # log type
          (?<ai>\S+)\s+(?<ap>\d+)\s+  # service ip:port
          (?<ci>\S+)\s+(?<cp>\d+)\s+  # client ip:port
          (?<id>\S+)\s+(?<cu>\S+)\s+  # login-id cert-user (unquoted)
          (?<m>\S+)\s+(?<p>\S+)\s+    # method proto
          "(?<h>[^"]*)"\s+            # host (quoted)
          (?<v>\S+)\s+                # http version
          (?<s>\d+)\s+(?<bs>\d+)\s+(?<br>\d+)\s+  # status bs br
          (?<ch>\d+)\s+(?<tt>\d+)\s+  # cache-hit time-taken
          (?<si>\S+)\s+(?<sp>\d+)\s+(?<st>\d+)\s+  # server ip:port:time
          (?<sid>\S+)\s+              # session-id (unquoted)
          (?<rtf>\S+)\s+(?<pmf>\S+)\s+(?<pf>\S+)\s+(?<wmf>\S+)\s+  # flags
          (?:""-""|"(?<u>[^"]*)")\s+            # url (quoted)
          (?:""-""|(?:""-""|"(?<q>[^"]*)"))\s+            # query (quoted, may be "-" for null)
          (?:""-""|(?:""-""|"(?<r>[^"]*)"))\s+            # referer (quoted)
          (?:""-""|"(?<c>[^"]*)")\s+            # cookie (quoted)
          "(?<ua>[^"]*)"\s+           # user-agent (quoted, multi-word)
          (?<px>\S+)\s+(?<pp>\d+)\s+  # proxy ip:port
          (?<au>\S+)\s+               # auth-user (unquoted)
          (?<cs1>\S+)\s+(?<cs2>\S+)\s+(?<cs3>\S+)\s+  # custom headers
          (?<cc>\S+)\s+               # country code
          (?<uid>\S+)\s*$             # unique id
        /x

        n = body.match(tr_re)
        next unless n

        # Helper: strip surrounding quotes from a captured token; return nil if null
        strip = ->(v) { return nil if v.nil? || v == "-"; v }

        event.set("[destination][ip]",              n[:ai])
        event.set("[destination][port]",            n[:ap].to_i)
        event.set("[source][ip]",                   n[:ci])
        event.set("[source][port]",                 n[:cp].to_i)
        event.set("[waas][login_id]",               strip.(n[:id] == "\"-\"" ? nil : n[:id]))
        event.set("[waas][cert_user]",              strip.(n[:cu] == "\"-\"" ? nil : n[:cu]))
        event.set("[http][request][method]",        n[:m])
        event.set("[network][transport]",           n[:p])
        event.set("[url][domain]",                  strip.(n[:h]))
        event.set("[http][version]",                n[:v])
        event.set("[http][response][status_code]",  n[:s].to_i)
        event.set("[http][response][body][bytes]",  n[:bs].to_i)
        event.set("[http][request][body][bytes]",   n[:br].to_i)
        event.set("[waas][cache_hit]",              n[:ch].to_i)
        event.set("[waas][time_taken_ms]",          n[:tt].to_i)
        # server ip: unquoted, "-" means null
        event.set("[waas][server_ip]",              strip.(n[:si] == "\"-\"" ? nil : n[:si]))
        event.set("[waas][server_port]",            n[:sp].to_i)
        event.set("[waas][server_time_ms]",         n[:st].to_i)
        event.set("[waas][session_id]",             strip.(n[:sid] == "\"-\"" ? nil : n[:sid]))
        event.set("[waas][response_type]",          n[:rtf])
        event.set("[waas][profile_matched]",        n[:pmf])
        event.set("[waas][protected]",              n[:pf])
        event.set("[waas][wf_matched]",             n[:wmf])
        # quoted fields: inner content; "-" inside quotes = null
        event.set("[url][path]",                    n[:u] == "-" ? nil : n[:u])
        event.set("[url][query]",                   n[:q] == "-" ? nil : n[:q])
        event.set("[http][request][referrer]",      n[:r] == "-" ? nil : n[:r])
        event.set("[waas][cookie]",                 n[:c] == "-" ? nil : n[:c])
        event.set("[user_agent][original]",         n[:ua])
        event.set("[waas][proxy_ip]",               n[:px])
        event.set("[waas][proxy_port]",             n[:pp].to_i)
        event.set("[waas][auth_user]",              strip.(n[:au] == "\"-\"" ? nil : n[:au]))
        event.set("[waas][custom_header_1]",        strip.(n[:cs1] == "\"-\"" ? nil : n[:cs1]))
        event.set("[waas][custom_header_2]",        strip.(n[:cs2] == "\"-\"" ? nil : n[:cs2]))
        event.set("[waas][custom_header_3]",        strip.(n[:cs3] == "\"-\"" ? nil : n[:cs3]))
        event.set("[source][geo][country_iso_code]",n[:cc])
        event.set("[waas][event_id]",               n[:uid])
      '
    }
  }

  # Step 2b: WF — Ruby regex parser
  else if [waas][log_type] == "WF" {
    ruby {
      tag_on_exception => "_waas_wf_ruby_fail"
      code => '
        msg = event.get("message").to_s
        m = msg.match(/\d{4}-\d{2}-\d{2} \d.*/)
        next unless m
        body = m[0]

        # WF format: DATE TIME TZ UNIT WF SEVERITY ATTACK_TYPE
        #   SRC_IP SRC_PORT DST_IP DST_PORT RULE_ID RULE_TYPE ACTION FOLLOW_UP
        #   METHOD "URL" "QUERY" PROTO SID "UA" PX_IP PX_PORT AU "REFERER" CC UID [ATTACK_DETAIL...]
        wf_re = /
          \S+\s+\S+\s+\S+\s+   # date time tz
          \S+\s+                 # unit
          WF\s+                  # log type
          (?<sl>\S+)\s+(?<ad>\S+)\s+   # severity attack_type
          (?<ci>\S+)\s+(?<cp>\d+)\s+   # src ip:port
          (?<ai>\S+)\s+(?<ap>\d+)\s+   # dst ip:port
          (?<ri>\S+)\s+(?<rt>\S+)\s+(?<at>\S+)\s+(?<fa>\S+)\s+  # rule*2 action follow-up
          (?<m>\S+)\s+                 # method
          (?:""-""|"(?<u>[^"]*)")\s+             # url (quoted)
          (?:""-""|"(?<q>[^"]*)")\s+             # query (quoted)
          (?<p>\S+)\s+                 # proto
          (?<sid>\S+)\s+               # session-id (unquoted)
          "(?<ua>[^"]*)"\s+            # user-agent (quoted)
          (?<px>\S+)\s+(?<pp>\d+)\s+  # proxy ip:port
          (?<au>\S+)\s+               # auth-user (unquoted)
          (?:""-""|"(?<r>[^"]*)")\s+            # referer (quoted)
          (?<cc>\S+)\s+               # country code
          (?<uid>\S+)                  # unique id
          (?:\s+(?<adl>.+))?$          # attack detail (optional, greedy rest)
        /x

        n = body.match(wf_re)
        next unless n

        event.set("[waas][severity]",          n[:sl])
        event.set("[waas][attack_type]",        n[:ad])
        event.set("[source][ip]",               n[:ci])
        event.set("[source][port]",             n[:cp].to_i)
        event.set("[destination][ip]",          n[:ai])
        event.set("[destination][port]",        n[:ap].to_i)
        event.set("[waas][rule_id]",            n[:ri])
        event.set("[waas][rule_type]",          n[:rt])
        event.set("[waas][action]",             n[:at])
        event.set("[waas][follow_up_action]",   n[:fa])
        event.set("[http][request][method]",    n[:m])
        event.set("[url][path]",                n[:u] == "-" ? nil : n[:u])
        event.set("[url][query]",               n[:q] == "-" ? nil : n[:q])
        event.set("[network][transport]",       n[:p])
        event.set("[waas][session_id]",         n[:sid] == "\"-\"" ? nil : n[:sid])
        event.set("[user_agent][original]",     n[:ua])
        event.set("[waas][proxy_ip]",           n[:px])
        event.set("[waas][proxy_port]",         n[:pp].to_i)
        event.set("[waas][auth_user]",          n[:au] == "\"-\"" ? nil : n[:au])
        event.set("[http][request][referrer]",  n[:r] == "-" ? nil : n[:r])
        event.set("[source][geo][country_iso_code]", n[:cc])
        event.set("[waas][event_id]",           n[:uid])
        adl = n[:adl]
        if adl && adl != "-" && adl != "\"-\""
          event.set("[waas][attack_detail]", adl)
        end
        # ECS event fields
        event.set("[event][action]", n[:at])
        event.set("[event][outcome]", n[:at] == "DENY" ? "failure" : "success")
      '
    }
  }

  # Step 3: @timestamp from dissect date/time/tz
  if [t_date] and [t_time] {
    mutate { add_field => { "_waas_ts" => "%{t_date} %{t_time} %{t_tz}" } }
    date {
      match       => [ "_waas_ts", "yyyy-MM-dd HH:mm:ss.SSS Z", "yyyy-MM-dd HH:mm:ss.SS Z", "yyyy-MM-dd HH:mm:ss.S Z" ]
      target      => "@timestamp"
      remove_field => ["_waas_ts", "t_date", "t_time", "t_tz"]
    }
  }

  # Step 4: cleanup
  mutate { remove_field => ["message", "type"] }
}

output {
  if [waas][log_type] == "TR" {
    elasticsearch {
      hosts => ["https://__ES_HOST__:9200"]
      user  => "__LS_ES_USER__"
      password => "${LS_ES_PASSWORD}"
      ssl_certificate_authorities => ["__LS_ES_CA_PATH__"]
      data_stream => "true"
      data_stream_type => "logs"
      data_stream_dataset => "barracuda.waas.access"
      data_stream_namespace => "default"
    }
  } else if [waas][log_type] == "WF" {
    elasticsearch {
      hosts => ["https://__ES_HOST__:9200"]
      user  => "__LS_ES_USER__"
      password => "${LS_ES_PASSWORD}"
      ssl_certificate_authorities => ["__LS_ES_CA_PATH__"]
      data_stream => "true"
      data_stream_type => "logs"
      data_stream_dataset => "barracuda.waas.firewall"
      data_stream_namespace => "default"
    }
  } else {
    elasticsearch {
      hosts => ["https://__ES_HOST__:9200"]
      user  => "__LS_ES_USER__"
      password => "${LS_ES_PASSWORD}"
      ssl_certificate_authorities => ["__LS_ES_CA_PATH__"]
      data_stream => "true"
      data_stream_type => "logs"
      data_stream_dataset => "barracuda.waas.unknown"
      data_stream_namespace => "default"
    }
  }
}
