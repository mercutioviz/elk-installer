# Barracuda WAF-as-a-Service (WaaS) pipeline — v0.2.2
# Tokens: __LS_INTERNAL_PORT__ __LS_ES_USER__ __LS_ES_CA_PATH__ __ES_HOST__ __VENDOR__ __PATTERNS_DIR__
#
# WaaS format strings (set in each app's Custom Syslog UI):
#
#   TR: TS=%t UN=%un LT=%lt AI=%ai AP=%ap CI=%ci CP=%cp ID=%id CU=%cu M=%m P=%p H=%h V=%v S=%s BS=%bs BR=%br CH=%ch TT=%tt SI=%si SP=%sp ST=%st SID=%sid RTF=%rtf PMF=%pmf PF=%pf WMF=%wmf U=%u Q=%q R=%r C=%c UA="%ua" PX=%px PP=%pp AU=%au CS1=%cs1 CS2=%cs2 CS3=%cs3 CC=%cc UID=%uid
#
#   WF: TS=%t UN=%un LT=%lt SL=%sl AD=%ad CI=%ci CP=%cp AI=%ai AP=%ap RI=%ri RT=%rt AT=%at FA=%fa M=%m U=%u Q=%q P=%p SID=%sid UA="%ua" PX=%px PP=%pp AU=%au R=%r CC=%cc UID=%uid ADL=%adl
#
# Design notes:
#   - The kv filter handles all KEY=VALUE pairs in a single pass.
#   - allow_quoted_values => true lets UA="multi word value" parse correctly.
#   - include_keys prevents the ADL sub-fields (pattern=, token=, etc.)
#     from polluting the event.
#   - ADL is captured separately with a simple GREEDYDATA grok (just scans
#     for "ADL=" and takes the rest of the line — no complex field matching).
#   - TS= contains spaces (date time tz), so kv only captures the date part.
#     We use the rsyslog ISO8601 header timestamp for @timestamp instead.
#     has a line break; we strip it with a gsub.

input {
  tcp {
    port  => __LS_INTERNAL_PORT__
    codec => line
    type  => "__VENDOR__"
    tags  => ["barracuda-waas"]
  }
}

filter {
  # ── Step 1: @timestamp from rsyslog header (ISO8601, 1-second precision) ──
  grok {
    match => { "message" => "^%{TIMESTAMP_ISO8601:rsl_ts}" }
    tag_on_failure => ["_waas_rsl_ts_fail"]
  }
  if [rsl_ts] {
    date {
      match       => ["rsl_ts", "ISO8601"]
      target      => "@timestamp"
      remove_field => ["rsl_ts"]
    }
  }

  # ── Step 2: kv — parse all KEY=VALUE pairs in one pass ────────────────
  kv {
    source              => "message"
    field_split         => " "
    value_split         => "="
    target              => "[waas]"
    # Only the keys we defined in the WaaS format strings.
    # This excludes the sub-keys inside ADL= (pattern=, token=, etc.).
    include_keys        => [
      "UN","LT",
      "AI","AP","CI","CP",
      "ID","CU","M","P","H","V",
      "S","BS","BR","CH","TT",
      "SI","SP","ST","SID",
      "RTF","PMF","PF","WMF",
      "U","Q","R","C",
      "PX","PP","AU","CS1","CS2","CS3","CC","UID",
      "SL","AD","RI","RT","AT","FA"
    ]
    allow_duplicate_values => false
    tag_on_failure => ["_waas_kv_fail"]
  }

  # ── Step 2b: UA — separate grok (kv can't handle quoted multi-word values) ──
  grok {
    match => { "message" => "UA=\"%{DATA:[user_agent][original]}\""  }
    tag_on_failure => []
  }

  # ── Step 3: ADL (WF attack detail) — simple scan for "ADL=" ──────────
  # This single-token GREEDYDATA grok scans for the literal string "ADL="
  # and captures everything after it. No complex field matching needed.
  if [waas][LT] == "WF" {
    grok {
      match => { "message" => "ADL=%{GREEDYDATA:[waas][ADL]}" }
      tag_on_failure => []   # silence — WF events without ADL are fine
    }
    # Tilde and some other attacks set ADL="-"; treat that as no detail.
    if [waas][ADL] == '"-"' or [waas][ADL] == "-" {
      mutate { remove_field => ["[waas][ADL]"] }
    }
  }

  # ── Step 4: ECS field rename + type conversions + cleanup ─────────────
  mutate {
    rename => {
      # ECS standard fields
      "[waas][CI]"  => "[source][ip]"
      "[waas][CP]"  => "[source][port]"
      "[waas][AI]"  => "[destination][ip]"
      "[waas][AP]"  => "[destination][port]"
      "[waas][M]"   => "[http][request][method]"
      "[waas][P]"   => "[network][transport]"
      "[waas][H]"   => "[url][domain]"
      "[waas][V]"   => "[http][version]"
      "[waas][S]"   => "[http][response][status_code]"
      "[waas][BS]"  => "[http][response][body][bytes]"
      "[waas][BR]"  => "[http][request][body][bytes]"
      "[waas][U]"   => "[url][path]"
      "[waas][Q]"   => "[url][query]"
      "[waas][R]"   => "[http][request][referrer]"
      "[waas][UA]"  => "[user_agent][original]"
      "[waas][CC]"  => "[source][geo][country_iso_code]"
      # Renamed waas.* fields
      "[waas][LT]"  => "[waas][log_type]"
      "[waas][UN]"  => "[waas][unit_name]"
      "[waas][UID]" => "[waas][event_id]"
      "[waas][SID]" => "[waas][session_id]"
      "[waas][RTF]" => "[waas][response_type]"
      "[waas][PMF]" => "[waas][profile_matched]"
      "[waas][PF]"  => "[waas][protected]"
      "[waas][WMF]" => "[waas][wf_matched]"
      "[waas][TT]"  => "[waas][time_taken_ms]"
      "[waas][CH]"  => "[waas][cache_hit]"
      "[waas][SI]"  => "[waas][server_ip]"
      "[waas][SP]"  => "[waas][server_port]"
      "[waas][ST]"  => "[waas][server_time_ms]"
      "[waas][PX]"  => "[waas][proxy_ip]"
      "[waas][PP]"  => "[waas][proxy_port]"
      "[waas][AU]"  => "[waas][auth_user]"
      "[waas][ID]"  => "[waas][login_id]"
      "[waas][CU]"  => "[waas][cert_user]"
      "[waas][CS1]" => "[waas][custom_header_1]"
      "[waas][CS2]" => "[waas][custom_header_2]"
      "[waas][CS3]" => "[waas][custom_header_3]"
      # WF-specific
      "[waas][SL]"  => "[waas][severity]"
      "[waas][AD]"  => "[waas][attack_type]"
      "[waas][AT]"  => "[waas][action]"
      "[waas][FA]"  => "[waas][follow_up_action]"
      "[waas][RI]"  => "[waas][rule_id]"
      "[waas][RT]"  => "[waas][rule_type]"
      "[waas][ADL]" => "[waas][attack_detail]"
    }
    convert => {
      "[source][port]"                => "integer"
      "[destination][port]"           => "integer"
      "[http][response][status_code]" => "integer"
      "[http][response][body][bytes]" => "integer"
      "[http][request][body][bytes]"  => "integer"
      "[waas][cache_hit]"             => "integer"
      "[waas][time_taken_ms]"         => "integer"
      "[waas][server_port]"           => "integer"
      "[waas][server_time_ms]"        => "integer"
      "[waas][proxy_port]"            => "integer"
    }
    # Null sentinel cleanup: WaaS outputs "-" for missing optional fields
    gsub => ["[url][query]",            "^-$", ""]
    gsub => ["[url][domain]",           "^-$", ""]
    gsub => ["[http][request][referrer]","^-$", ""]
    gsub => ["[user_agent][original]",  "^-$", ""]
    gsub => ["[waas][session_id]",      "^-$", ""]
    gsub => ["[waas][auth_user]",       "^-$", ""]
    gsub => ["[waas][login_id]",        "^-$", ""]
    gsub => ["[waas][cert_user]",       "^-$", ""]
    gsub => ["[waas][custom_header_1]", "^-$", ""]
    gsub => ["[waas][custom_header_2]", "^-$", ""]
    gsub => ["[waas][custom_header_3]", "^-$", ""]

    remove_field => ["message", "type", "[waas][TS]", "[waas][C]"]
  }

  # ── Step 4b: %p → correct ECS fields ────────────────────────────────────
  # WaaS %p outputs TLSv1.x, HTTPS, or HTTP — not an L4 transport.
  # ECS: network.transport=tcp/udp, tls.version=1.x, network.application=http/https.
  if [network][transport] =~ /^TLSv/ {
    mutate {
      gsub      => ["[network][transport]", "^TLSv", ""]
      rename    => { "[network][transport]" => "[tls][version]" }
      add_field => {
        "[network][transport]"   => "tcp"
        "[network][application]" => "https"
      }
    }
  } else if [network][transport] == "HTTPS" {
    mutate {
      replace   => { "[network][transport]" => "tcp" }
      add_field => { "[network][application]" => "https" }
    }
  } else if [network][transport] == "HTTP" {
    mutate {
      replace   => { "[network][transport]" => "tcp" }
      add_field => { "[network][application]" => "http" }
    }
  }

  # ── Step 5: WF — ECS event fields + severity normalization ───────────
  if [waas][log_type] == "WF" {
    if [waas][action] {
      mutate { add_field => { "[event][action]" => "%{[waas][action]}" } }
      if [waas][action] == "DENY" {
        mutate { add_field => { "[event][outcome]" => "failure" } }
      } else {
        mutate { add_field => { "[event][outcome]" => "success" } }
      }
    }
    # WaaS outputs 4-char syslog severity abbreviations; normalize to full names.
    translate {
      field    => "[waas][severity]"
      target   => "[waas][severity]"
      override => true
      dictionary  => {
        "EMER" => "EMERGENCY"
        "ALER" => "ALERT"
        "CRIT" => "CRITICAL"
        "ERRO" => "ERROR"
        "WARN" => "WARNING"
        "NOTI" => "NOTICE"
        "INFO" => "INFORMATIONAL"
        "DEBU" => "DEBUG"
      }
    }
  }
}

output {
  if [waas][log_type] == "TR" {
    elasticsearch {
      hosts => ["https://__ES_HOST__:9200"]
      user  => "__LS_ES_USER__"
      password => "${LS_ES_PASSWORD}"
      ssl_certificate_authorities => ["__LS_ES_CA_PATH__"]
      data_stream => "true"
      data_stream_type => "logs"
      data_stream_dataset => "barracuda.waas.access"
      data_stream_namespace => "default"
    }
  } else if [waas][log_type] == "WF" {
    elasticsearch {
      hosts => ["https://__ES_HOST__:9200"]
      user  => "__LS_ES_USER__"
      password => "${LS_ES_PASSWORD}"
      ssl_certificate_authorities => ["__LS_ES_CA_PATH__"]
      data_stream => "true"
      data_stream_type => "logs"
      data_stream_dataset => "barracuda.waas.firewall"
      data_stream_namespace => "default"
    }
  } else {
    elasticsearch {
      hosts => ["https://__ES_HOST__:9200"]
      user  => "__LS_ES_USER__"
      password => "${LS_ES_PASSWORD}"
      ssl_certificate_authorities => ["__LS_ES_CA_PATH__"]
      data_stream => "true"
      data_stream_type => "logs"
      data_stream_dataset => "barracuda.waas.unknown"
      data_stream_namespace => "default"
    }
  }
}
