name: barracuda-waas
version: 0.2.2
description: |
  Barracuda WAF-as-a-Service (WaaS) syslog ingest.
  Parses both TR (Traffic/Access) and WF (Web Firewall) record types
  into separate ECS-shaped data streams.

  TR → logs-barracuda.waas.access-default
  WF → logs-barracuda.waas.firewall-default

maintainers:
  - mscollins@barracuda.com

defaults:
  udp_port: 5142
  tcp_port: 5142

contents:
  rsyslog:       []
  logstash:      ["logstash/30-barracuda-waas.conf"]
  elasticsearch:
    component_templates: []
    index_templates:     []
    ilm_policies:        []
  kibana:
    data_views: []
    dashboards: []

fields:
  # rsyslog header (stripped during processing)
  - name: "@timestamp"
    type: date
  # TR + WF common
  - name: "source.ip"
    type: ip
  - name: "source.port"
    type: long
  - name: "destination.ip"
    type: ip
  - name: "destination.port"
    type: long
  - name: "http.request.method"
    type: keyword
  - name: "url.path"
    type: wildcard
  - name: "url.query"
    type: wildcard
  - name: "user_agent.original"
    type: keyword
  - name: "network.transport"
    type: keyword
  - name: "network.application"
    type: keyword
  - name: "tls.version"
    type: keyword
  - name: "source.geo.country_iso_code"
    type: keyword
  # TR specific
  - name: "http.response.status_code"
    type: long
  - name: "http.response.body.bytes"
    type: long
  - name: "http.request.referrer"
    type: wildcard
  - name: "waas.unit_name"
    type: keyword
  - name: "waas.log_type"
    type: keyword
  - name: "waas.response_type"
    type: keyword
  - name: "waas.protected"
    type: keyword
  - name: "waas.wf_matched"
    type: keyword
  - name: "waas.event_id"
    type: keyword
  # WF specific
  - name: "waas.severity"
    type: keyword
  - name: "waas.attack_type"
    type: keyword
  - name: "waas.action"
    type: keyword
  - name: "waas.attack_detail"
    type: text

changelog:
  - version: 0.2.2
    date: 2026-06-18
    notes: |
      Fix network.transport semantic mismatch: WaaS %p outputs TLSv1.x/HTTP/HTTPS,
      not an L4 transport. Now mapped to tls.version (e.g. "1.3"), network.transport
      ("tcp"), and network.application ("http"/"https"). Add null-sentinel gsub for
      waas.custom_header_1/2/3. Normalize WaaS 4-char severity abbreviations
      (ALER, CRIT, etc.) to full names (ALERT, CRITICAL, etc.) via translate filter.
  - version: 0.2.1
    date: 2026-05-31
    notes: |
      Remove #012 (embedded newline) cleanup mutate — no longer needed after
      switching to RSYSLOG_FileFormat forwarding template.
  - version: 0.2.0
    date: 2026-05-31
    notes: |
      Rewrite to kv-filter pipeline. Single-pass KEY=VALUE parsing replaces
      multi-grok positional approach. UA extracted separately (quoted multi-word).
      ADL captured with GREEDYDATA. ECS field renames and type conversions.
  - version: 0.1.0
    date: 2026-05-31
    notes: |
      Initial pipeline. Parses WaaS custom syslog format with quoted fields.
      Handles ""-"" double-double-quoted nulls, multi-word UAs, GREEDYDATA %adl.
      Both TR (access) and WF (firewall) record types routed to separate
      data streams.
