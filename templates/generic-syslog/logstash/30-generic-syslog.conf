# generic-syslog pipeline — RFC3164/5424 catch-all.
# Owned by template generic-syslog. Hand edits get overwritten on apply.
#
# Tokens (substituted at apply time by lib/ls.sh):
#   __VENDOR__            — vendor name (here: generic-syslog)
#   __VENDOR_DATASET__    — vendor name with '-' replaced by '.' (data stream dataset)
#   __LS_INTERNAL_PORT__  — port LS binds for rsyslog->LS forwarding
#   __LS_ES_USER__        — Elasticsearch user (logstash_internal)
#   __LS_ES_CA_PATH__     — path to ES HTTP CA on disk
#   __ES_HOST__           — private IP/hostname of the Elasticsearch node

input {
  tcp {
    port => __LS_INTERNAL_PORT__
    codec => line
    type => "syslog"
    tags => ["__VENDOR__"]
  }
}

filter {
  grok {
    match => { "message" => "%{SYSLOGLINE}" }
    tag_on_failure => ["_grokparsefailure", "_syslogline_no_match"]
  }

  if "_grokparsefailure" not in [tags] {
    date {
      match => [ "timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss", "ISO8601" ]
      remove_field => ["timestamp"]
    }
  }

  mutate {
    rename => { "logsource" => "[host][name]" }
    rename => { "program"   => "[process][name]" }
    rename => { "pid"       => "[process][pid]" }
  }
}

output {
  elasticsearch {
    hosts => ["https://__ES_HOST__:9200"]
    user  => "__LS_ES_USER__"
    password => "${LS_ES_PASSWORD}"
    ssl_certificate_authorities => ["__LS_ES_CA_PATH__"]
    data_stream => "true"
    data_stream_type      => "logs"
    data_stream_dataset   => "__VENDOR_DATASET__"
    data_stream_namespace => "default"
  }
}
