# inventory.yml — small-prod deployment on AWS us-east-2
# Three hosts in the same VPC/subnet: ES, LS, Kibana.
# Generated 2026-05-30 from profile small-prod.

profile: small-prod

# Pinned to latest 9.x patch as of 2026-05-29. Verified from Elastic apt repo.
stack_version: "9.4.2"

hosts:
  - name: elk-es-01
    # Debian 13, t3.medium, us-east-2
    address: 10.10.24.233
    ssh_user: admin
    ssh_key: ~/.ssh/AWS-USEast2-Key.pem
    roles:
      - es-master
      - es-data

  - name: elk-ls-01
    # Debian 13, t3.medium, us-east-2
    address: 10.10.29.245
    ssh_user: admin
    ssh_key: ~/.ssh/AWS-USEast2-Key.pem
    roles:
      - logstash

  - name: elk-kbn-01
    # Debian 13, t3.medium, us-east-2; EIP 3.150.78.176 DNS: elk.waaslab.com
    address: 10.10.31.12
    ssh_user: admin
    ssh_key: ~/.ssh/AWS-USEast2-Key.pem
    roles:
      - kibana

tls:
  ca_subject: "CN=elk-small-prod CA"
  cert_validity_days: 825

kibana:
  public_fqdn: "elk.waaslab.com"
  letsencrypt_email: "mscollins@barracuda.com"
  allowed_cidrs:
    - 10.10.0.0/16             # VPC
    - 108.240.247.96/32        # admin workstation

firewall:
  manage: true
  intra_cluster_cidrs:
    - 10.10.0.0/16

templates:
  - name: generic-syslog
    enabled: true
    udp_port: 5140
    tcp_port: 5140
  - name: barracuda-waf
    enabled: true
    udp_port: 5142
    tcp_port: 5142

  - name: barracuda-waas
    enabled: true
    udp_port: 5141
    tcp_port: 5141

os_tuning:
  set_vm_max_map_count: true
  disable_swap: false    # 4GB swapfiles created intentionally on t3.medium

self_monitoring:
  metricbeat: false
  filebeat:   false
